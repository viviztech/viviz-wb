<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="no-referrer"/>
  <title>Forgot Password - Viviz WhatsApp Business</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body class="h-full bg-gradient-to-br from-teal-900 via-teal-800 to-green-900 flex items-center justify-center p-4">
  <main class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex w-16 h-16 bg-green-400 rounded-full items-center justify-center mb-4"><i class="fas fa-key text-white text-2xl"></i></div>
      <h1 class="text-2xl font-bold text-white">Reset your password</h1>
      <p class="text-teal-200 text-sm mt-1">We will email a time-limited reset link</p>
    </div>
    <div class="bg-white rounded-2xl shadow-xl p-8">
      {% if success %}
      <div class="bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg text-sm flex items-start gap-2">
        <i class="fas fa-check-circle mt-0.5"></i><span>{{ success }}</span>
      </div>
      {% else %}
      <form method="POST" action="/forgot-password" class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Administrator email</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-envelope text-sm"></i></span>
            <input id="email" type="email" name="email" required autocomplete="email" autofocus placeholder="admin@example.com" class="w-full pl-9 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"/>
          </div>
        </div>
        <button type="submit" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-medium py-2.5 rounded-lg transition text-sm"><i class="fas fa-paper-plane mr-2"></i>Send reset link</button>
      </form>
      {% endif %}
      <a href="/login" class="mt-6 block text-center text-sm font-medium text-teal-700 hover:text-teal-900"><i class="fas fa-arrow-left mr-1"></i> Back to sign in</a>
    </div>
  </main>
</body>
</html>
